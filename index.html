<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Smart Campus AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f8ff;--card:#fff;--tx:#0f1f3d;--mu:#5b6b86;--pr:#1d5fd1;--bd:#dbe5f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0c1424;--card:#142038;--tx:#e8eefb;--mu:#95a5c4;--pr:#5b9bff;--bd:#25365a}}
:root[data-theme=dark]{--bg:#0c1424;--card:#142038;--tx:#e8eefb;--mu:#95a5c4;--pr:#5b9bff;--bd:#25365a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,Segoe UI,sans-serif}
header{display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--pr);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{flex:1}header button{background:#ffffff30;color:#fff;border:0;border-radius:8px;padding:6px 10px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px}nav button,.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:7px 14px;white-space:nowrap;cursor:pointer}
nav button.on,.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
main{max-width:900px;margin:auto;padding:0 14px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.grid .card{margin:0;text-align:center}.grid h2{margin:0;color:var(--pr)}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0}
.btn{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:8px 14px;cursor:pointer}.btn.s{background:var(--card);color:var(--pr);border:1px solid var(--pr)}.btn.d{background:#d93a3a}
.msg{padding:10px 14px;border-radius:14px;margin:8px 0;max-width:88%;white-space:pre-wrap}.u{background:var(--pr);color:#fff;margin-left:auto}.a{background:var(--card);border:1px solid var(--bd)}
.src{font-size:12px;color:var(--mu);margin-top:6px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}.row input{flex:1}
dialog{border:0;border-radius:14px;max-width:460px;width:94%;background:var(--card);color:var(--tx)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:9}
.mu{color:var(--mu)}h1{margin:14px 0 4px}small{color:var(--mu)}

:root{--pr:#3949d6;--bg:#f3f6fd;--bd:#dde3f3}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--pr:#7b8cff}}
:root[data-theme=dark]{--pr:#7b8cff}
header{flex-wrap:wrap;background:linear-gradient(100deg,#0a1640,#1f2f95 60%,#3949d6);padding:10px 18px}
header>b{font-size:17px;flex:0 0 auto;cursor:pointer}
header nav{display:flex;gap:2px;padding:0;overflow-x:auto;flex:1}
header nav button{background:none;border:0;color:#dfe6ff;border-radius:8px;padding:7px 11px;transition:.2s;white-space:nowrap}
header nav button:hover,header nav button.on{background:#ffffff26;color:#fff}
header nav button.cta{background:#fff;color:#1f2f95;font-weight:600;margin-left:4px}
@media(max-width:700px){header nav{order:3;flex:1 0 100%}}
main{max-width:1060px}.card{border-radius:12px;transition:transform .2s,box-shadow .2s}
.card.h{cursor:pointer}.card.h:hover{transform:translateY(-3px);box-shadow:0 10px 24px #2a3fb826}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;padding:34px 0}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(28px,5vw,44px);margin:10px 0 0}.hero h2{font-size:clamp(17px,2.6vw,22px);color:var(--pr);margin:4px 0 10px;font-weight:600}
.pill{font-size:12px;padding:4px 10px;border-radius:20px;background:#3949d61a;color:var(--pr)}
.btn.big{padding:11px 20px}.stats{display:flex;gap:22px;margin-top:20px}.stats b{display:block;font-size:22px;color:var(--pr)}
.phone{background:linear-gradient(160deg,#0a1640,#26379f);border-radius:18px;padding:16px;box-shadow:0 20px 50px #1f2f9544}
.phone .msg{font-size:14px}.phone .a{background:#ffffff14;border-color:#ffffff30;color:#fff}.phone .u{background:#fff;color:#1f2f95}
.dots i{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--pr);animation:b 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}.phone .dots i{background:#fff}
@keyframes b{50%{transform:translateY(-5px);opacity:.4}}@keyframes in{from{opacity:0;transform:translateY(6px)}}.msg{animation:in .3s}
.sec{padding:24px 0}.sec h3{font-size:22px;margin:0 0 10px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.g .card{margin:0}
.ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:19px;background:linear-gradient(135deg,#e4e9ff,#c9d3ff);margin-bottom:8px}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}.flow .card{margin:0;padding:10px 16px}.flow span{color:var(--pr)}
.psi{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.psi .card{margin:0}@media(max-width:700px){.psi{grid-template-columns:1fr}}
</style></head><body>
<header><b onclick="go('home')">◆ SmartCampus AI</b><nav id="nav"></nav><span id="role"></span><button onclick="tg()">◐</button></header><main id="m"></main><div id="toast"></div>
<dialog id="dlg"><form method="dialog" id="fm" onsubmit="return false"></form></dialog>
<script>
const E={
students:{t:'Students',f:['name','studentId','email','phone','dept','year','section']},
faculty:{t:'Faculty',f:['name','facultyId','email','phone','dept','designation','subjects','office']},
departments:{t:'Departments',f:['name','code','hod','description']},
classrooms:{t:'Classrooms',f:['building','room','floor','capacity','dept','type','facilities']},
timetable:{t:'Timetable',f:['dept','year','section','day','start','end','subject','faculty','room']},
events:{t:'Events',f:['name','date','time','venue','description','organizer','registration']},
announcements:{t:'Announcements',f:['title','body','audience','pinned']},
resources:{t:'Academic Resources',f:['title','type','dept','year','link','description']},
facilities:{t:'Campus Facilities',f:['name','category','location','timings','description']},
locations:{t:'Campus Locations',f:['building','location','floor','room','description','coordinates']},
faqs:{t:'FAQs',f:['question','answer']},
knowledge:{t:'AI Knowledge Base',f:['question','answer'],fac:1}};
const S={d:{},view:'home',flt:'',col:'timetable',q:'',pg:0,fac:false,uid:null,prof:{},chats:[],cur:null,busy:false};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db,user,sample;
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2500)};
const tg=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme=='dark'?'light':'dark'};
const uid=()=>Math.random().toString(36).slice(2,10);
async function init(){
 try{user=await claude.use('user');db=await claude.use('db');sample=await claude.use('sample')}catch(e){}
 if(!db||!user){$('#m').innerHTML='<div class="card">Please open this page signed in to claude.ai to use the database.</div>';return}
 S.uid=await user.id();S.fac=!!((await user.can('data.write'))??(await user.canEdit()));
 $('#role').textContent=S.fac?'Faculty':'Student';
 for(const k in E)db.collection(k).onSnapshot(s=>{S.d[k]=s.docs.map(d=>({_id:d.id,...d.data()}));if(!S.busy)render()},()=>{});
 db.collection('data/users/'+S.uid+'/chats').onSnapshot(s=>{S.chats=s.docs.map(d=>({_id:d.id,...d.data()})).sort((a,b)=>b.ts-a.ts);if(!S.busy)render()},()=>{});
 db.doc('data/users/'+S.uid+'/meta/profile').onSnapshot(s=>{S.prof=s.data()||{};if(!S.busy)render()},()=>{});
 render()}
function nav(){const t=[['home','Home'],['dash','Dashboard'],['chat','AI Assistant'],['campus','Campus'],['features','Features'],['about','About']];if(S.fac)t.push(['panel','Faculty Panel']);
 $('#nav').innerHTML=t.map(([k,l])=>`<button class="${S.view==k?'on':''}" onclick="${k=='features'||k=='about'?`sc('${k}')`:`go('${k}')`}">${l}</button>`).join('')+`<button onclick="go('profile')">Login</button><button class="cta" onclick="go(S.fac?'panel':'dash')">Get Started</button>`}
function sc(id){S.view='home';render();setTimeout(()=>document.getElementById(id)?.scrollIntoView({behavior:'smooth'}),60)}
function go(v,c){S.view=v;S.flt='';if(c){S.col=c;S.q='';S.pg=0}render();scrollTo(0,0)}
function render(){nav();({home:vHome,dash:vDash,chat:vChat,campus:vCampus,profile:vProfile,panel:vPanel})[S.view]()}
/* ---------- CHAT ---------- */
function curChat(){return S.chats.find(c=>c._id==S.cur)}
function vChat(){const c=curChat(),msgs=c?c.messages:[];
 $('#m').innerHTML=`<h1>SMART CAMPUS AI</h1><small>Your Intelligent Campus Companion</small>
 <div class="row" style="margin:10px 0"><select id="cs" onchange="S.cur=this.value;render()"><option value="">+ New chat</option>${S.chats.map(x=>`<option value="${x._id}" ${x._id==S.cur?'selected':''}>${esc(x.title)}</option>`).join('')}</select>
 ${c?'<button class="btn s" onclick="clrChat()">Clear</button><button class="btn s" onclick="renChat()">Rename</button><button class="btn d" onclick="delChat()">Delete</button>':''}</div>
 <input id="cq" placeholder="Search conversations..." oninput="sq(this.value)">
 <div id="ms">${msgs.length?msgs.map(m=>`<div class="msg ${m.r=='u'?'u':'a'}">${esc(m.t)}${m.s?`<div class="src">Source: ${esc(m.s)}</div>`:''}</div>`).join(''):'<div class="card mu">Ask anything about your campus. Try:<div class="row" style="margin-top:8px">'+['Where is my next class?','What is today\'s timetable?','Where is the library?','What events are happening today?','Who is my faculty advisor?'].map(q=>`<span class="chip" onclick="ask(this.textContent)">${q}</span>`).join('')+'</div></div>'}</div>
 <div id="typ"></div><div class="row" style="margin-top:10px"><input id="in" placeholder="Ask anything about your campus..." onkeydown="if(event.key=='Enter')ask()"><button class="btn s" onclick="voice()">🎤</button><button class="btn" onclick="ask()">Send</button></div>
 <div class="row" style="margin-top:12px">${['timetable','events','announcements','faculty','locations','resources'].map(k=>`<span class="chip" onclick="go('campus','${k}')">${E[k].t}</span>`).join('')}</div>`}
function sq(v){document.querySelectorAll('#cs option').forEach(o=>o.hidden=o.value&&!o.textContent.toLowerCase().includes(v.toLowerCase()))}
async function clrChat(){if(!await cf('Clear this conversation?'))return;await db.doc('data/users/'+S.uid+'/chats/'+S.cur).update({messages:[]});toast('Cleared')}
async function renChat(){const t=await pr('Rename conversation',curChat().title);if(t)await db.doc('data/users/'+S.uid+'/chats/'+S.cur).update({title:t})}
async function delChat(){if(await cf('Delete this conversation?')){await db.doc('data/users/'+S.uid+'/chats/'+S.cur).delete();S.cur=null;toast('Deleted')}}
function voice(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('Voice input not supported in this browser');const r=new R();r.onresult=e=>{$('#in').value=e.results[0][0].transcript};r.start()}
const NF="Sorry, I couldn't find this information in the campus database.";
const STOP=new Set('the a an is are was of in on at to for and or my me i we you what where who when how which do does can there any this that with about tell show please find give get'.split(' '));
const stem=w=>w.length<4?w:w.replace(/ies$/,'y').replace(/sses$/,'ss').replace(/([^s])s$/,'$1');
const tok=s=>(String(s??'').toLowerCase().match(/[a-z0-9&]+/g)||[]).filter(x=>x.length>1);
const QT=q=>[...new Set(tok(q).filter(w=>!STOP.has(w)).map(stem))];
const INT={events:'event fest workshop happening seminar expo hackathon lecture',timetable:'timetable schedule class period',announcements:'announcement notice news circular',faculty:'faculty professor teacher hod advisor staff mentor',departments:'department hod',classrooms:'classroom room hall capacity',resources:'resource note paper syllabus assignment material exam pdf',facilities:'facility library canteen hostel lab sport medical transport office timing mess'};
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const ld=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const ad=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return ld(x)};
const clean=r=>Object.entries(r).filter(([k])=>k[0]!='_'&&k!='updated');
function gen(qt,intents){const out=[];
 for(const k in E){if(k=='students'&&!S.fac)continue;for(const r of S.d[k]||[]){const rt=new Set(tok(clean(r).map(x=>x[1]).join(' ')).map(stem));let s=0;qt.forEach(w=>{if(rt.has(w))s+=2});if(s&&intents.includes(k))s++;if(s>=2)out.push({k,r,s})}}
 out.sort((a,b)=>b.s-a.s);const top=out[0]?.s||0,n={};return out.filter(x=>x.s>=top*.6&&(n[x.k]=(n[x.k]||0)+1)<=4).slice(0,8)}
function retrieve(q){return gen(QT(q),[])}
function plan(q,now=new Date()){const td=ld(now),ql=q.toLowerCase(),qt=QT(q);
 const intents=Object.keys(INT).filter(k=>INT[k].split(' ').some(w=>qt.includes(stem(w))));
 if(qt.length){let best=null;for(const k of ['knowledge','faqs'])for(const r of S.d[k]||[]){const rt=[...new Set(QT(r.question))],m=qt.filter(w=>rt.includes(w)).length;if(m/qt.length>=.7&&m/rt.length>=.5&&(!best||m>best.m))best={m,r,k}}
  if(best)return{direct:best.r.answer,src:E[best.k].t+': '+best.r.question,ctx:[]}}
 const wd=DAYS.find(d=>ql.includes(d.toLowerCase()));
 if(intents.includes('timetable')){const p=S.prof||{};if(!p.dept||!p.year||!p.section)return{ctx:[],empty:'Please complete your profile (Department, Year, Section) so I can find your timetable.'};
  const nz=x=>String(x??'').trim().toLowerCase(),pad=x=>String(x).padStart(5,'0'),mine=(S.d.timetable||[]).filter(t=>nz(t.dept)==nz(p.dept)&&nz(t.year)==nz(p.year)&&nz(t.section)==nz(p.section)),st=(a,b)=>pad(a.start).localeCompare(pad(b.start)),hm=now.toTimeString().slice(0,5);
  const day=wd||(/tomorrow/.test(ql)?DAYS[(now.getDay()+1)%7]:/today|tonight/.test(ql)?DAYS[now.getDay()]:null);let rows,facts;
  if(/next (class|period|lecture)/.test(ql)){for(let i=0;i<7&&!rows;i++){const dn=DAYS[(now.getDay()+i)%7],r=mine.filter(t=>t.day==dn&&(i>0||pad(t.start)>hm)).sort(st)[0];if(r){rows=[r];facts=`This is the student's next class (${i==0?'today':i==1?'tomorrow':'on '+dn}).`}}
   if(!rows)return{ctx:[],empty:`No upcoming classes found for ${p.dept} Year ${p.year} Section ${p.section} in the timetable.`}}
  else if(day){rows=mine.filter(t=>t.day==day).sort(st);facts=`Timetable for ${day}.`}
  else{rows=[...mine].sort((a,b)=>DAYS.indexOf(a.day)-DAYS.indexOf(b.day)||st(a,b));facts='Full weekly timetable.'}
  if(!rows.length)return{ctx:[],empty:`No classes found for ${p.dept} Year ${p.year} Section ${p.section}${day?' on '+day:''} in the timetable.`};
  return{ctx:rows.map(r=>({k:'timetable',r})),facts}}
 if(intents.includes('events')){let a=td,b='9999-12-31',lab='the upcoming days';
  if(/tomorrow/.test(ql)){a=b=ad(now,1);lab='tomorrow'}else if(/today|tonight/.test(ql)){b=td;lab='today'}else if(/next week/.test(ql)){a=ad(now,7);b=ad(now,13);lab='next week'}else if(/week/.test(ql)){b=ad(now,6);lab='this week'}
  const rows=(S.d.events||[]).filter(e=>e.date>=a&&e.date<=b).sort((x,y)=>x.date.localeCompare(y.date));
  if(!rows.length)return{ctx:[],empty:`No events found for ${lab} in the campus database.`};
  return{ctx:rows.slice(0,8).map(r=>({k:'events',r})),facts:`These events fall in the requested period (${lab}).`}}
 return{ctx:gen(qt,intents),facts:''}}

const fmt=x=>E[x.k].f.map(f=>x.r[f]?f+': '+x.r[f]:'').filter(Boolean).join(', ');
async function ask(q){q=(q||$('#in').value).trim();if(!q||S.busy)return;S.busy=true;
 let c=curChat();if(!c){const id=uid();c={_id:id,title:q.slice(0,40),messages:[],ts:Date.now()};S.chats.unshift(c);S.cur=id}
 c.messages.push({r:'u',t:q});vChat();$('#typ').innerHTML='<div class="msg a"><span class="dots"><i></i><i></i><i></i></span></div>';
 const now=new Date(),P=plan(q,now);let a=P.empty||NF,src='';
 if(P.direct){a=P.direct;src=P.src}
 else if(P.ctx.length){src=P.ctx.slice(0,3).map(x=>E[x.k].t+': '+x.r[E[x.k].f[0]]).join(' · ');
  const fb="Here is what I found in the campus database:\n"+P.ctx.slice(0,6).map(x=>'• '+fmt(x)).join('\n');a=fb;
  if(sample){try{const r=await sample(`You are Smart Campus AI. Answer the question using ONLY the CAMPUS RECORDS below. Copy names, rooms, floors, dates and times exactly as written. Never add facts that are not in the records. If the records do not answer the question, reply exactly: ${NF}\nToday is ${DAYS[now.getDay()]}, ${ld(now)}; current time ${now.toTimeString().slice(0,5)}. ${P.facts||''}\nCAMPUS RECORDS:\n${P.ctx.map((x,i)=>`[${i+1}] (${E[x.k].t}) ${fmt(x)}`).join('\n')}\n\nQuestion: ${q}\nGive a short, direct answer (1-3 sentences, or a short list for several items).`,{cache:false});a=r.text.trim()||fb}catch(e){a=fb}}}
 if(a.includes("couldn't find this information"))src='';
 c.messages.push({r:'a',t:a,s:src});c.ts=Date.now();
 try{await db.doc('data/users/'+S.uid+'/chats/'+c._id).set({title:c.title,messages:c.messages,ts:c.ts})}catch(e){toast('Could not save chat')}
 S.busy=false;render()}
/* ---------- CAMPUS / CRUD ---------- */
function list(k){let rows=S.d[k]||[];const ff=FF(k);if(S.flt&&ff)rows=rows.filter(r=>r[ff]==S.flt);const q=S.q.toLowerCase();if(q)rows=rows.filter(r=>Object.values(r).join(' ').toLowerCase().includes(q));return rows}
const FF=k=>['dept','category','type','building'].find(x=>E[k].f.includes(x));
function fsel(k){const f=FF(k);if(!f)return'';const v=[...new Set((S.d[k]||[]).map(r=>r[f]).filter(Boolean))];return `<select style="width:auto" onchange="S.flt=this.value;S.pg=0;render()"><option value="">All ${f}</option>${v.map(x=>`<option ${x==S.flt?'selected':''}>${esc(x)}</option>`).join('')}</select>`}
function table(k,edit){const e=E[k],rows=list(k),N=8,pages=Math.max(1,Math.ceil(rows.length/N));if(S.pg>=pages)S.pg=0;const pr=rows.slice(S.pg*N,S.pg*N+N);
 return `<div class="row"><input placeholder="Search ${e.t}..." value="${esc(S.q)}" oninput="S.q=this.value;S.pg=0;clearTimeout(window._t);window._t=setTimeout(()=>{render();const i=document.querySelector('#m input[placeholder^=Search]');i.focus();i.setSelectionRange(99,99)},300)">${fsel(k)}${edit?`<button class="btn" onclick="openForm('${k}')">+ Add New</button>`:''}</div>
 ${pr.length?pr.map(r=>`<div class="card"><b>${esc(r[e.f[0]])}</b>${e.f.slice(1).map(f=>r[f]?`<div class="mu"><small>${f}:</small> ${esc(r[f])}</div>`:'').join('')}
 ${edit?`<div class="row" style="margin-top:8px"><button class="btn s" onclick="openForm('${k}','${r._id}')">Edit</button><button class="btn d" onclick="del('${k}','${r._id}')">Delete</button></div>`:''}</div>`).join(''):`<div class="card mu">${S.d[k]?'No records found.':'Loading…'}</div>`}
 <div class="row"><button class="btn s" ${S.pg?'':'disabled'} onclick="S.pg--;render()">‹ Prev</button><small>Page ${S.pg+1} / ${pages}</small><button class="btn s" ${S.pg<pages-1?'':'disabled'} onclick="S.pg++;render()">Next ›</button></div>`}
function chips(ks){return `<div class="row" style="margin:6px 0">${ks.map(k=>`<span class="chip ${S.col==k?'on':''}" onclick="go('${S.view}','${k}')">${E[k].t}</span>`).join('')}</div>`}
function vCampus(){const ks=Object.keys(E).filter(k=>!['students','knowledge'].includes(k));if(!ks.includes(S.col))S.col='timetable';$('#m').innerHTML=`<h1>Campus Info</h1>${chips(ks)}${table(S.col,false)}`}
function vPanel(){if(!S.fac)return go('home');const ks=Object.keys(E);if(!ks.includes(S.col))S.col='students';
 $('#m').innerHTML=`<h1>Faculty Management Panel</h1><small>Welcome, Faculty</small>
 <div class="grid" style="margin:10px 0">${['students','faculty','departments','classrooms','events','announcements','resources'].map(k=>`<div class="card"><h2>${(S.d[k]||[]).length}</h2><small>${E[k].t}</small></div>`).join('')}<div class="card"><h2>${S.d.knowledge?.length||0}</h2><small>AI Knowledge</small></div></div>
 <div class="row"><button class="btn" onclick="go('panel','students');openForm('students')">+ Add Student</button><button class="btn" onclick="go('panel','events');openForm('events')">+ Add Event</button><button class="btn" onclick="go('panel','announcements');openForm('announcements')">+ Add Announcement</button><button class="btn" onclick="go('panel','timetable');openForm('timetable')">+ Add Timetable</button><button class="btn s" onclick="go('profile')">Faculty Profile</button></div>
 ${chips(ks)}${table(S.col,true)}`}
function openForm(k,id){const e=E[k],r=id?S.d[k].find(x=>x._id==id):{};

 <div class="row" style="margin-top:10px"><button type="button" class="btn" onclick="save('${k}','${id||''}')">Save</button><button type="button" class="btn s" onclick="$('#dlg').close()">Cancel</button></div>`;$('#dlg').showModal()}
const cf=m=>new Promise(r=>{$('#fm').innerHTML=`<h3>${esc(m)}</h3><div class="row"><button type="button" class="btn d" id="y">Yes, continue</button><button type="button" class="btn s" id="n">Cancel</button></div>`;const d=$('#dlg');d.oncancel=()=>r(false);$('#y').onclick=()=>{d.close();r(true)};$('#n').onclick=()=>{d.close();r(false)};d.showModal()});
const pr=(m,v)=>new Promise(r=>{$('#fm').innerHTML=`<h3>${esc(m)}</h3><input id="pi" value="${esc(v)}"><div class="row"><button type="button" class="btn" id="y">Save</button><button type="button" class="btn s" id="n">Cancel</button></div>`;const d=$('#dlg');d.oncancel=()=>r(null);$('#y').onclick=()=>{const x=$('#pi').value.trim();d.close();r(x)};$('#n').onclick=()=>{d.close();r(null)};d.showModal()});
async function save(k,id){const o={};new FormData($('#fm')).forEach((v,f)=>o[f]=v);if(!o[E[k].f[0]].trim())return toast('First field is required');
 try{await db.doc(k+'/'+(id||uid())).set({...o,updated:Date.now()});$('#dlg').close();toast('Saved')}catch(e){toast('Save failed: '+(e.message||e.code))}}
async function del(k,id){if(!await cf('Delete this record? This cannot be undone.'))return;try{await db.doc(k+'/'+id).delete();toast('Deleted')}catch(e){toast('Delete failed: '+(e.message||e.code))}}

 $('#m').innerHTML=`<section class="hero"><div><span class="pill">● AI-powered · live campus data</span><h1>Smart Campus AI</h1><h2>Your Campus. One Intelligent Assistant.</h2><p class="mu">An AI-powered campus companion that helps students find information, navigate campus services and stay connected — instantly.</p>

const rs=()=>{try{return JSON.parse(localStorage.getItem('rs')||'[]')}catch(e){return[]}};
